<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow&family=Barlow+Condensed:wght@400;700&family=Bellefair&display=swap" rel="stylesheet">
    <script defer src="js/script.js"></script>
    <title>Space Tourism</title>
</head>

<body class="page-crew">

    <header>

        <div class="header__logo">
            <a href="index.html"><img src="assets/shared/logo.svg" alt="Space Tourism Home"></a>
            <div class="header__line" aria-hidden="true"></div>
        </div>

        <button class="header__toggle" aria-controls="primary-navigation" aria-expanded="false">
            <img src="assets/shared/icon-hamburger.svg" alt="Open menu">
        </button>

        <nav class="main-nav">

            <button class="main-nav__close" aria-label="close menu"><img src="assets/shared/icon-close.svg" alt="Close menu"></button>

            <ul id="primary-navigation" class="main-nav__list text-preset-8">
                <li class="main-nav__item"><a href="index.html" class="main-nav__link"><span class="bold ltr-spc--2-7px">00</span>HOME</a></li>
                <li class="main-nav__item"><a href="destination.html" class="main-nav__link"><span class="bold ltr-spc--2-7px">01</span>DESTINATION</a></li>
                <li class="main-nav__item"><a href="crew.html" class="main-nav__link is-active"><span class="bold ltr-spc--2-7px">02</span>CREW</a></li>
                <li class="main-nav__item"><a href="technology.html" class="main-nav__link"><span class="bold ltr-spc--2-7px">03</span>TECHNOLOGY</a></li>
            </ul>
        </nav>

    </header>

    <main class="crew">

        <div class="crew__container">

            <h2 class="text-preset-5-destination"><span class="text-preset-10">02</span>meet your  crew</h2>

            <div class="crew__content">
                
                <div class="crew__wrapper-text">

                    <div class="crew__wrapper-text__info">

                        <div class="crew__wrapper-text__rank-name">
                            <h3 id="crew-role" class="text-preset-4 opacity-50">Commander </h3>
                            <h2 id="crew-name" class="text-preset-3">Douglas Hurley</h2>
                        </div>

                        <p id="crew-bio" class="text-preset-9 text-blue-300">Douglas Gerald Hurley is an American engineer, former Marine Corps pilot and former NASA astronaut. He launched into space for the third time as commander of Crew Dragon Demo-2.</p>

                    </div>

                    <div class="crew__dot-menu">
                        <button class="dot-menu__btn is-active" data-crew="commander" aria-label="Commander"></button>
                        <button class="dot-menu__btn" data-crew="mission specialist" aria-label="Mission Specialist"></button>
                        <button class="dot-menu__btn" data-crew="pilot" aria-label="Pilot"></button>
                        <button class="dot-menu__btn" data-crew="flight engineer" aria-label="Flight Engineer"></button>
                    </div>

                </div>

                <div class="crew__wrapper-img">
                    <img src="assets/crew/image-douglas-hurley.png" alt="Picture of Commander Douglas Hurley">
                </div>

            </div>
        </div>
    </main>
</body>
</html>
